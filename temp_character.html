<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>임시 캐릭터 말랑이 (three.js)</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #F4EFE8;
    font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif; color: #4a3b33; }
  canvas { display: block; touch-action: none; }
  .card { position: fixed; top: 16px; left: 16px; background: rgba(255,255,255,.82);
    backdrop-filter: blur(6px); padding: 12px 16px; border-radius: 14px; max-width: 280px;
    box-shadow: 0 4px 18px rgba(80,60,40,.10); }
  .card h1 { font-size: 16px; margin: 0 0 4px; }
  .card p { font-size: 12.5px; margin: 0; line-height: 1.5; opacity: .8; }
  #now { font-weight: 700; color: #5f9e50; }
  .bar { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); display: flex;
    gap: 8px; flex-wrap: wrap; justify-content: center; width: min(560px, 94vw); }
  button { border: 0; border-radius: 999px; padding: 9px 14px; font-size: 13.5px; font-weight: 600;
    background: #fff; color: #4a3b33; box-shadow: 0 3px 12px rgba(80,60,40,.15); cursor: pointer; }
  button.on { background: #4a3b33; color: #fff; }
  button.primary { background: #7CC46A; color: #fff; }
  #msg { position: fixed; bottom: 112px; left: 50%; transform: translateX(-50%); font-size: 12.5px;
    background: rgba(74,59,51,.88); color: #fff; padding: 8px 12px; border-radius: 10px;
    max-width: 86vw; text-align: center; display: none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div class="card">
  <h1>임시 캐릭터 · 말랑이</h1>
  <p>블렌더 모델이 나오기 전까지 쓰는 대역이에요. 키 약 18cm, 원점은 발바닥.<br>
  책상 가운데 반경 20cm 안에서만 움직여요. 지금: <span id="now">쉬는 중</span></p>
</div>
<div class="bar">
  <button id="auto" class="on">자동 ON</button>
  <button data-act="walk">아장아장</button>
  <button data-act="wave">손 흔들기</button>
  <button data-act="look">두리번</button>
  <button data-act="hop">콩 점프</button>
  <button data-act="nap">꾸벅 졸기</button>
  <button id="export" class="primary">GLB로 저장</button>
</div>
<div id="msg"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

/* ---------- 장면 기본 설정 ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#F4EFE8');

const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.01, 10);
camera.position.set(0.42, 0.36, 0.62);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.05, 0);
controls.enableDamping = true;
controls.minDistance = 0.18;
controls.maxDistance = 1.5;
controls.maxPolarAngle = Math.PI * 0.49;

scene.add(new THREE.HemisphereLight('#fffaf2', '#c9b39a', 1.6));
const sun = new THREE.DirectionalLight('#ffffff', 2.2);
sun.position.set(0.4, 0.8, 0.5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -0.4, right: 0.4, top: 0.4, bottom: -0.4, near: 0.1, far: 2 });
sun.shadow.bias = -0.0005;
scene.add(sun);

// 책상 (미리보기용, 내보내기에는 포함 안 됨) — 반지름 40cm
const desk = new THREE.Mesh(
  new THREE.CylinderGeometry(0.4, 0.4, 0.02, 64),
  new THREE.MeshStandardMaterial({ color: '#C89B6D', roughness: 0.7 })
);
desk.position.y = -0.01;
desk.receiveShadow = true;
scene.add(desk);

/* ---------- 임시 캐릭터 ----------
   단위: cm로 만들고 루트에서 0.01배 → 내보낸 GLB는 미터 단위(AR 실제 크기).
   블렌더 모델이 완성되면 이 함수 대신 GLTFLoader로 .glb를 불러오면 됩니다. */
function createTempCharacter() {
  const mat = (color, roughness = 0.85) => new THREE.MeshStandardMaterial({ color, roughness });
  const M = {
    body: mat('#FFE3B3'), eye: mat('#2B2420', 0.3), shine: mat('#FFFFFF', 0.2),
    cheek: mat('#FF9FAE', 0.9), mouth: mat('#5A3A33', 0.6), leaf: mat('#7CC46A', 0.7),
  };
  const sphere = new THREE.SphereGeometry(1, 48, 32);
  const part = (name, material, pos, scale, rot = [0, 0, 0], geo = sphere) => {
    const m = new THREE.Mesh(geo, material);
    m.name = name; m.position.set(...pos); m.scale.set(...scale); m.rotation.set(...rot);
    m.castShadow = true;
    return m;
  };
  const group = (name, pos = [0, 0, 0]) => { const g = new THREE.Group(); g.name = name; g.position.set(...pos); return g; };

  const root = group('TempCharacter');   // 발바닥 = 원점
  root.scale.setScalar(0.01);
  const anim = group('AnimRoot');        // 점프·뒤뚱 (내보낼 때 초기화)
  root.add(anim);

  // 발 (걸을 때 번갈아 들림)
  const feet = [-1, 1].map(s => {
    const f = part(`Foot_${s < 0 ? 'L' : 'R'}`, M.body, [s * 3.2, 1.2, 1.0], [2.4, 1.3, 2.9]);
    anim.add(f); return f;
  });

  // 몸통
  const bodyGroup = group('BodyGroup');
  anim.add(bodyGroup);
  bodyGroup.add(part('Body', M.body, [0, 8.6, 0], [8.4, 7.6, 7.6]));

  // 팔: 어깨 위치에 피벗을 두어 흔들 수 있게
  const arms = [-1, 1].map(s => {
    const pivot = group(`Shoulder_${s < 0 ? 'L' : 'R'}`, [s * 6.4, 8.6, 1.6]);
    pivot.add(part(`Arm_${s < 0 ? 'L' : 'R'}`, M.body, [s * 1.2, -1.8, 0], [1.6, 2.4, 1.6], [0, 0, s * 0.5]));
    bodyGroup.add(pivot); return pivot;
  });

  // 눈 (깜빡임용 그룹)
  const eyes = [-1, 1].map(s => {
    const side = s < 0 ? 'L' : 'R';
    const g = group(`EyeGroup_${side}`, [s * 2.6, 9.8, 7.0]);
    g.add(part(`Eye_${side}`, M.eye, [0, 0, 0], [0.78, 1.0, 0.45]));
    g.add(part(`EyeShine_${side}`, M.shine, [0.25, 0.35, 0.38], [0.26, 0.26, 0.12]));
    bodyGroup.add(g); return g;
  });
  for (const s of [-1, 1])
    bodyGroup.add(part(`Cheek_${s < 0 ? 'L' : 'R'}`, M.cheek, [s * 4.6, 8.4, 6.25], [1.25, 0.75, 0.3], [0, s * 0.63, 0]));
  bodyGroup.add(part('Mouth', M.mouth, [0, 8.85, 7.45], [1, 1, 1], [0, 0, Math.PI],
    new THREE.TorusGeometry(0.7, 0.17, 10, 24, Math.PI)));

  // 새싹
  const sprout = group('Sprout', [0, 15.9, 0]);
  bodyGroup.add(sprout);
  sprout.add(part('Stem', M.leaf, [0, 0.9, 0], [1, 1, 1], [0, 0, 0], new THREE.CylinderGeometry(0.22, 0.28, 2.0, 12)));
  sprout.add(part('Leaf_L', M.leaf, [-1.35, 2.0, 0], [1.6, 0.42, 0.9], [0, 0,  0.45]));
  sprout.add(part('Leaf_R', M.leaf, [ 1.35, 2.0, 0], [1.6, 0.42, 0.9], [0, 0, -0.45]));

  return { root, anim, bodyGroup, sprout, arms, eyes, feet };
}

const ch = createTempCharacter();
scene.add(ch.root);

/* ---------- 동작 ----------
   모두 작고 느리게. 이동은 책상 중심 반경 ROAM 안에서만. */
const ROAM = 0.20;           // m — 책상(40cm) 안쪽 여유
const WALK_SPEED = 0.035;    // m/s
const TURN_SPEED = 3.0;      // rad/s
const ease = p => p * p * (3 - 2 * p);
const bell = p => Math.sin(Math.PI * Math.min(Math.max(p, 0), 1));   // 0→1→0
const angleDiff = (a, b) => Math.atan2(Math.sin(b - a), Math.cos(b - a));

const nowEl = document.getElementById('now');
const LABEL = { idle: '쉬는 중', walk: '아장아장', wave: '손 흔들기', look: '두리번', hop: '콩 점프', nap: '꾸벅 졸기' };

let act = { name: 'idle', t: 0, dur: 2 };
let auto = true;
let nextBlink = 2;

function clearPose() {   // 동작 중간에 바뀌어도 자세가 남지 않게
  ch.anim.position.set(0, 0, 0); ch.anim.rotation.set(0, 0, 0); ch.anim.scale.set(1, 1, 1);
  ch.bodyGroup.rotation.set(0, 0, 0); ch.bodyGroup.position.set(0, 0, 0);
  ch.arms.forEach(a => a.rotation.set(0, 0, 0));
  ch.eyes.forEach(e => e.scale.set(1, 1, 1));
  ch.feet.forEach(f => (f.position.y = 1.2));
}

function start(name) {
  clearPose();
  act = { name, t: 0, dur: { idle: 1.5 + Math.random() * 2, wave: 2.2, look: 3.2, hop: 0.6, nap: 4.5, walk: 12 }[name] };
  if (name === 'walk') {
    const p = ch.root.position;
    let tx, tz, tries = 0;
    do {   // 반경 안에서, 현재 위치와 6cm 이상 떨어진 곳
      const r = ROAM * Math.sqrt(Math.random()), a = Math.random() * Math.PI * 2;
      tx = Math.cos(a) * r; tz = Math.sin(a) * r;
    } while (Math.hypot(tx - p.x, tz - p.z) < 0.06 && ++tries < 20);
    act.target = new THREE.Vector2(tx, tz);
    act.phase = 0;
  }
  nowEl.textContent = LABEL[name];
}

function update(dt) {
  act.t += dt;
  const p = act.t / act.dur;
  const b = ch.bodyGroup, t = performance.now() / 1000;

  // 공통: 숨쉬기 + 새싹 흔들림
  const breathe = Math.sin(t * 2.2) * (act.name === 'nap' ? 0.035 : 0.022);
  b.scale.set(1 + breathe * 0.6, 1 - breathe, 1 + breathe * 0.6);
  ch.sprout.rotation.z = Math.sin(t * 2.6) * 0.15;

  // 깜빡임 (졸 때 빼고)
  if (act.name !== 'nap') {
    nextBlink -= dt;
    ch.eyes.forEach(e => (e.scale.y = nextBlink < 0 ? 1 - bell(-nextBlink / 0.14) * 0.88 : 1));
    if (nextBlink < -0.14) nextBlink = 2 + Math.random() * 3;
  }

  switch (act.name) {
    case 'walk': {
      const pos = ch.root.position;
      const dx = act.target.x - pos.x, dz = act.target.y - pos.z;
      const dist = Math.hypot(dx, dz);
      const heading = Math.atan2(dx, dz);
      const d = angleDiff(ch.root.rotation.y, heading);
      ch.root.rotation.y += Math.sign(d) * Math.min(Math.abs(d), TURN_SPEED * dt);
      if (Math.abs(d) < 0.35 && dist > 0.004) {
        const step = Math.min(dist, WALK_SPEED * dt);
        pos.x += dx / dist * step; pos.z += dz / dist * step;
        act.phase += dt * 9;
        // 뒤뚱뒤뚱: 좌우로 살짝 기울고 발이 번갈아 들림
        ch.anim.rotation.z = Math.sin(act.phase) * 0.07;
        ch.anim.position.y = Math.abs(Math.sin(act.phase)) * 0.5;
        ch.feet[0].position.y = 1.2 + Math.max(0, Math.sin(act.phase)) * 0.9;
        ch.feet[1].position.y = 1.2 + Math.max(0, -Math.sin(act.phase)) * 0.9;
        ch.arms[0].rotation.x = Math.sin(act.phase) * 0.35;
        ch.arms[1].rotation.x = -Math.sin(act.phase) * 0.35;
      }
      // 안전장치: 반경 밖으로 절대 안 나가게
      const r = Math.hypot(pos.x, pos.z);
      if (r > ROAM) { pos.x *= ROAM / r; pos.z *= ROAM / r; }
      if (dist <= 0.004 || act.t > act.dur) return 'done';
      break;
    }
    case 'wave': {   // 오른손 들고 살랑살랑
      const up = ease(Math.min(1, p / 0.2)) * ease(Math.min(1, (1 - p) / 0.2));
      ch.arms[1].rotation.z = up * (2.2 + Math.sin(act.t * 11) * 0.35);
      b.rotation.z = -up * 0.06;
      break;
    }
    case 'look': {   // 고개(몸) 좌우로 두리번
      b.rotation.y = Math.sin(p * Math.PI * 2) * 0.45 * bell(p);
      b.rotation.z = Math.sin(p * Math.PI * 2) * 0.05;
      break;
    }
    case 'hop': {    // 2cm짜리 작은 점프
      ch.anim.position.y = bell(p) * 2.0;
      const sq = p < 0.15 ? -bell(p / 0.15) * 0.1 : p > 0.85 ? -bell((p - 0.85) / 0.15) * 0.1 : bell(p) * 0.06;
      ch.anim.scale.set(1 - sq * 0.5, 1 + sq, 1 - sq * 0.5);
      break;
    }
    case 'nap': {    // 눈 감고 꾸벅
      const k = ease(Math.min(1, p / 0.2)) * ease(Math.min(1, (1 - p) / 0.2));
      ch.eyes.forEach(e => (e.scale.y = 1 - k * 0.88));
      b.rotation.x = k * (0.1 + Math.max(0, Math.sin(act.t * 1.6)) * 0.08);
      b.rotation.z = k * 0.08;
      ch.anim.scale.y = 1 - k * 0.04;
      break;
    }
  }
  if (act.name !== 'walk' && act.t >= act.dur) return 'done';
}

function pickNext() {
  if (act.name !== 'idle') return start('idle');
  if (!auto) return start('idle');
  const r = Math.random();
  start(r < 0.38 ? 'walk' : r < 0.55 ? 'look' : r < 0.70 ? 'wave' : r < 0.85 ? 'hop' : 'nap');
}

/* ---------- 루프 ---------- */
const clock = new THREE.Clock();
let paused = false;
start('idle');
(function loop() {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (!paused && update(dt) === 'done') pickNext();
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
})();

/* ---------- 입력 ---------- */
document.querySelectorAll('[data-act]').forEach(btn =>
  btn.addEventListener('click', () => start(btn.dataset.act)));

const autoBtn = document.getElementById('auto');
autoBtn.addEventListener('click', () => {
  auto = !auto;
  autoBtn.textContent = auto ? '자동 ON' : '자동 OFF';
  autoBtn.classList.toggle('on', auto);
});

// 캐릭터를 탭하면 콩 점프
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
let downAt = null;
renderer.domElement.addEventListener('pointerdown', e => { downAt = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 6) return;
  ptr.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  if (ray.intersectObject(ch.root, true).length) start('hop');
});

/* ---------- GLB 내보내기 (기본 자세, 원점 위치로) ---------- */
const msg = document.getElementById('msg');
const say = (text, ms = 4500) => { msg.textContent = text; msg.style.display = 'block';
  clearTimeout(say.t); say.t = setTimeout(() => msg.style.display = 'none', ms); };

document.getElementById('export').addEventListener('click', async () => {
  paused = true;
  const savedPos = ch.root.position.clone(), savedRot = ch.root.rotation.y;
  clearPose(); ch.bodyGroup.scale.set(1, 1, 1); ch.sprout.rotation.set(0, 0, 0);
  ch.root.position.set(0, 0, 0); ch.root.rotation.y = 0;
  try {
    const glb = await new GLTFExporter().parseAsync(ch.root, { binary: true });
    const url = URL.createObjectURL(new Blob([glb], { type: 'model/gltf-binary' }));
    const a = Object.assign(document.createElement('a'), { href: url, download: 'temp_character.glb' });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    say(window.self !== window.top
      ? '미리보기 화면에서는 다운로드가 막혀 있을 수 있어요. 이 HTML 파일을 내 컴퓨터 브라우저에서 열고 다시 눌러 주세요.'
      : 'temp_character.glb 저장 완료!');
  } catch (err) {
    say('내보내기 실패: ' + err.message);
  } finally {
    ch.root.position.copy(savedPos); ch.root.rotation.y = savedRot;
    start('idle');
    paused = false;
  }
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
